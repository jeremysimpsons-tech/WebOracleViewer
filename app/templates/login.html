<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — E1P DB Viewer</title>
  <link rel="icon" href="/static/favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v=5">
  <script src="/static/js/theme.js?v=4"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <img class="mark" src="/static/favicon.svg?v=4" alt="">
      <div>
        <h1>E1P DB Viewer</h1>
        <p>Oracle worksheet for this server</p>
      </div>
    </div>
    <form id="login-form">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <p id="login-error" class="form-error" role="alert"></p>
      <button id="login-submit" type="submit">Sign in</button>
    </form>
    <fieldset class="appearance">
      <legend>Appearance</legend>
      <div class="theme-grid">
        <label class="choice"><input type="radio" name="theme" value="dark"><span><strong>Dark</strong></span></label>
        <label class="choice"><input type="radio" name="theme" value="light"><span><strong>Light</strong></span></label>
        <label class="choice"><input type="radio" name="theme" value="midnight"><span><strong>Midnight</strong></span></label>
        <label class="choice"><input type="radio" name="theme" value="harbor"><span><strong>Harbor</strong></span></label>
        <label class="choice"><input type="radio" name="theme" value="sand"><span><strong>Sand</strong></span></label>
        <label class="choice"><input type="radio" name="theme" value="contrast"><span><strong>Contrast</strong></span></label>
      </div>
    </fieldset>
    <p class="fine">Version {{ version }}. This page is for the operator of this server.</p>
  </main>
  <noscript><p class="form-error">JavaScript is required to sign in.</p></noscript>
  <script src="/static/js/login.js"></script>
</body>
</html>
